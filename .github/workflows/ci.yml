name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - 'phpstan.neon.dist'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - 'phpstan.neon.dist'

permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: 
        - '8.1'
        - '8.2'
        - '8.3'
        - '8.4'
        - '8.5'

    steps:

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPUnit
        run: |
          vendor/bin/phpunit \
            --coverage-text \
            --coverage-clover coverage.xml \
            --log-junit junit.xml

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: Upload junit
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.php-version }}
          path: junit.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.php-version }}
          path: coverage.xml
