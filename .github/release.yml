changelog:
  categories:

    - title: 🚨 Breaking Changes
      labels:
        - breaking-change

    - title: 🚀 New Features
      labels:
        - enhancement

    - title: 🐛 Bug Fixes
      labels:
        - bug

    - title: 🛠️ Maintenance
      labels:
        - dependencies

    - title: 📚 Documentation
      labels:
        - documentation

    - title: Other Changes
      labels:
        - "*"

  exclude:
    labels:
      - skip-changelog
